<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" orient="auto" markerWidth="10" markerHeight="10" refX="8" refY="5">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="32" y="40" fill="#ffffff" font-size="25" font-weight="700">OmSree CRM &#8644; MS Access &#8212; Sync Agent Workflow</text>
  <text x="1168" y="40" fill="#94a3b8" font-size="13" text-anchor="end">Prepared for client review</text>

  <!-- Admin console -->
  <rect x="40" y="84" width="1120" height="78" rx="10" fill="#0f172a"/>
  <text x="64" y="118" fill="#ffffff" font-size="18" font-weight="700">Sync Agent &#8212; Admin Console</text>
  <text x="64" y="142" fill="#94a3b8" font-size="13">Runs on the office PC &#183; opened in a browser at http://127.0.0.1 &#183; admin login required</text>
  <g font-size="13" font-weight="600">
    <rect x="612" y="106" width="120" height="34" rx="17" fill="#1e293b" stroke="#38bdf8"/><text x="672" y="128" fill="#e2e8f0" text-anchor="middle">Connections</text>
    <rect x="744" y="106" width="104" height="34" rx="17" fill="#1e293b" stroke="#38bdf8"/><text x="796" y="128" fill="#e2e8f0" text-anchor="middle">Mappings</text>
    <rect x="860" y="106" width="104" height="34" rx="17" fill="#1e293b" stroke="#38bdf8"/><text x="912" y="128" fill="#e2e8f0" text-anchor="middle">Schedule</text>
    <rect x="976" y="106" width="80" height="34" rx="17" fill="#1e293b" stroke="#38bdf8"/><text x="1016" y="128" fill="#e2e8f0" text-anchor="middle">Email</text>
  </g>

  <!-- Triggers / config feeders -->
  <g>
    <rect x="40" y="188" width="300" height="64" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="58" y="214" fill="#5b21b6" font-size="15" font-weight="700">Field Mappings</text>
    <text x="58" y="236" fill="#6d28d9" font-size="12">what &amp; how to sync &#183; editable &#183; CSV import/export</text>

    <rect x="470" y="188" width="300" height="64" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="488" y="214" fill="#92400e" font-size="15" font-weight="700">&#9201; Scheduler (cron)</text>
    <text x="488" y="236" fill="#b45309" font-size="12">runs automatically every N minutes</text>

    <rect x="820" y="188" width="300" height="64" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="838" y="214" fill="#92400e" font-size="15" font-weight="700">&#9654; Sync Now</text>
    <text x="838" y="236" fill="#b45309" font-size="12">manual run from the dashboard</text>
  </g>

  <!-- Feeder arrows into engine -->
  <path d="M190,252 L370,290" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M620,252 L612,290" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M970,252 L808,290" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- CRM source -->
  <rect x="40" y="334" width="250" height="166" rx="10" fill="#336791" stroke="#24506f"/>
  <text x="165" y="372" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">OmSree CRM</text>
  <text x="165" y="396" fill="#cbd9e8" font-size="14" text-anchor="middle">PostgreSQL database</text>
  <line x1="64" y1="412" x2="266" y2="412" stroke="#5b7da0"/>
  <text x="165" y="436" fill="#ffffff" font-size="13" font-style="italic" text-anchor="middle">Source of truth</text>
  <text x="165" y="460" fill="#cbd9e8" font-size="12" text-anchor="middle">masters, bookings, pricing,</text>
  <text x="165" y="477" fill="#cbd9e8" font-size="12" text-anchor="middle">payments, eSign / CPP status</text>

  <!-- Engine -->
  <rect x="360" y="290" width="480" height="262" rx="10" fill="#f8fafc" stroke="#334155"/>
  <rect x="360" y="290" width="480" height="40" rx="10" fill="#0f172a"/>
  <rect x="360" y="312" width="480" height="18" fill="#0f172a"/>
  <text x="384" y="316" fill="#ffffff" font-size="16" font-weight="700">Sync Engine</text>
  <g font-size="13.5" fill="#0f172a">
    <circle cx="388" cy="358" r="11" fill="#38bdf8"/><text x="388" y="362" fill="#06283d" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="410" y="362">Read changed rows &#8212; only mapped, active fields</text>
    <circle cx="388" cy="391" r="11" fill="#38bdf8"/><text x="388" y="395" fill="#06283d" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="410" y="395">Compare with Access &#8212; compute the difference</text>
    <circle cx="388" cy="424" r="11" fill="#38bdf8"/><text x="388" y="428" fill="#06283d" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="410" y="428">Dry-run? show a preview, write nothing</text>
    <circle cx="388" cy="457" r="11" fill="#38bdf8"/><text x="388" y="461" fill="#06283d" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="410" y="461">Back up the .accdb before the first write</text>
    <circle cx="388" cy="490" r="11" fill="#38bdf8"/><text x="388" y="494" fill="#06283d" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="410" y="494">Apply inside a transaction &#8212; web wins</text>
    <circle cx="388" cy="523" r="11" fill="#38bdf8"/><text x="388" y="527" fill="#06283d" font-size="12" font-weight="700" text-anchor="middle">6</text>
    <text x="410" y="527">Record the result (rows written, status)</text>
  </g>

  <!-- Access target -->
  <rect x="910" y="334" width="250" height="166" rx="10" fill="#a4373a" stroke="#7d2a2c"/>
  <text x="1035" y="372" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">MS Access</text>
  <text x="1035" y="396" fill="#f3cdce" font-size="14" text-anchor="middle">.accdb on the office LAN</text>
  <line x1="934" y1="412" x2="1136" y2="412" stroke="#c47376"/>
  <text x="1035" y="436" fill="#ffffff" font-size="13" font-style="italic" text-anchor="middle">Stays in the office</text>
  <text x="1035" y="460" fill="#f3cdce" font-size="12" text-anchor="middle">the file never leaves the LAN;</text>
  <text x="1035" y="477" fill="#f3cdce" font-size="12" text-anchor="middle">only agreed fields are written</text>

  <!-- Pipeline arrows -->
  <path d="M290,417 L360,417" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="325" y="406" fill="#475569" font-size="12" font-style="italic" text-anchor="middle">reads</text>
  <path d="M840,417 L910,417" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="875" y="406" fill="#475569" font-size="12" font-style="italic" text-anchor="middle">writes</text>

  <!-- Outputs -->
  <path d="M560,552 L520,592" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M640,552 L780,592" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="380" y="596" width="260" height="58" rx="9" fill="#e2e8f0" stroke="#64748b"/>
  <text x="510" y="622" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">Sync Log</text>
  <text x="510" y="642" fill="#475569" font-size="12" text-anchor="middle">every run recorded + sync.log</text>
  <rect x="660" y="596" width="280" height="58" rx="9" fill="#fee2e2" stroke="#ef4444"/>
  <text x="800" y="622" fill="#991b1b" font-size="15" font-weight="700" text-anchor="middle">Email alert &#8212; on failure</text>
  <text x="800" y="642" fill="#b91c1c" font-size="12" text-anchor="middle">sent to the configured recipients</text>

  <!-- Guarantees -->
  <g font-size="13.5" font-weight="600">
    <rect x="40" y="694" width="360" height="44" rx="9" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="220" y="721" fill="#166534" text-anchor="middle">&#10003; Web is the source of truth (web-wins)</text>
    <rect x="420" y="694" width="360" height="44" rx="9" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="600" y="721" fill="#166534" text-anchor="middle">&#10003; Access never leaves the office LAN</text>
    <rect x="800" y="694" width="360" height="44" rx="9" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="980" y="721" fill="#166534" text-anchor="middle">&#10003; Dry-run first &#8212; approve before writing</text>
  </g>
  <text x="600" y="772" fill="#475569" font-size="13" text-anchor="middle">Exactly which tables and fields sync is controlled by the editable field mappings &#8212; no code changes needed.</text>
</svg>
