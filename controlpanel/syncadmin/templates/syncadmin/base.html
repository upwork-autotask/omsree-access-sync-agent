<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OmSree Sync Agent{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --err:#ef4444; --line:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Segoe UI, system-ui, sans-serif; background:#f1f5f9; color:#0f172a; }
    header { background:var(--bg); color:var(--ink); padding:0 16px; display:flex; align-items:center; gap:18px; }
    header .brand { font-weight:700; color:#fff; padding:14px 0; }
    nav a { color:var(--ink); text-decoration:none; padding:14px 10px; display:inline-block; font-size:14px; }
    nav a:hover, nav a.active { color:var(--accent); border-bottom:2px solid var(--accent); }
    header .right { margin-left:auto; color:var(--muted); font-size:13px; }
    header .right a { color:var(--muted); }
    main { max-width:1000px; margin:24px auto; padding:0 16px; }
    h1 { font-size:22px; margin:0 0 16px; }
    h2 { font-size:16px; margin:24px 0 8px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:18px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    label { display:block; font-size:13px; color:#475569; margin:10px 0 4px; }
    input[type=text], input[type=password], input[type=number], input[type=email], select, textarea {
      width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:7px; font-size:14px; background:#fff; }
    .row { display:flex; gap:14px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:180px; }
    button, .btn { background:var(--accent); color:#06283d; border:0; padding:9px 16px; border-radius:7px; font-weight:600; cursor:pointer; font-size:14px; text-decoration:none; display:inline-block; }
    button.secondary, .btn.secondary { background:#e2e8f0; color:#0f172a; }
    button.danger { background:var(--err); color:#fff; }
    button.ok { background:var(--ok); color:#04240f; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:7px 8px; border-bottom:1px solid #e2e8f0; }
    th { color:#475569; font-weight:600; }
    .pill { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .pill.on { background:#dcfce7; color:#166534; } .pill.off { background:#fee2e2; color:#991b1b; }
    .pill.ok { background:#dcfce7; color:#166534; } .pill.error { background:#fee2e2; color:#991b1b; } .pill.dry-run { background:#e0f2fe; color:#075985; }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:10px; font-size:14px; }
    .msg.success { background:#dcfce7; color:#166534; } .msg.error { background:#fee2e2; color:#991b1b; } .msg.info { background:#e0f2fe; color:#075985; }
    .muted { color:#64748b; font-size:13px; }
    code { background:#f1f5f9; padding:1px 5px; border-radius:4px; }
    pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:12px; max-height:360px; }
  </style>
</head>
<body>
{% if user.is_authenticated %}
<header>
  <span class="brand">OmSree Sync Agent</span>
  <nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'connections' %}">Connections</a>
    <a href="{% url 'mappings' %}">Mappings</a>
    <a href="{% url 'schedule' %}">Schedule</a>
    <a href="{% url 'settings' %}">Settings</a>
    <a href="{% url 'email_settings' %}">Email</a>
    <a href="{% url 'logs' %}">Logs</a>
  </nav>
  <span class="right">{{ user.username }} &middot; <a href="{% url 'logout' %}">logout</a></span>
</header>
{% endif %}
<main>
  {% if messages %}
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
